<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>물꼬 · 노후하수관로 정비 통합 설계 플랫폼</title>
<link rel="stylesheet" href="./vendor/stlite/stlite.css" />
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #fff; font-family: system-ui, "Malgun Gothic", sans-serif; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 12px; color: #334; text-align: center; padding: 16px; }
  #boot b { font-size: 18px; } #boot small { color: #667; }
</style>
</head>
<body>
<div id="boot"><b>물꼬</b><span>노후하수관로 정비 통합 설계 플랫폼</span><span id="msg">프로그램을 불러오는 중입니다…</span>
<small>처음 접속 시 브라우저에 파이썬(약 70MB)을 내려받아 20~60초 걸립니다. 외부 서버 없이 이 주소에서만 받습니다. 계산은 모두 이 기기 안에서 이루어지며 올린 파일은 서버로 전송되지 않습니다.</small></div>
<div id="root"></div>
<script type="module">
import { mount } from "./vendor/stlite/stlite.js";
const msg = document.getElementById("msg");
try {
  const list = await (await fetch("./files.json", { cache: "no-cache" })).json();
  const files = {};
  for (const f of list) files[f] = { url: "./" + encodeURI(f) };
  mount({
    requirements: ["openpyxl", "ezdxf", "altair", "pyshp", "pyproj"],
    entrypoint: "report_ui/app.py",
    pyodideUrl: new URL("./vendor/pyodide/pyodide.mjs", location.href).href,
    files,
    streamlitConfig: { "client.toolbarMode": "viewer", "theme.base": "light", "server.maxUploadSize": 200 },
  }, document.getElementById("root"));
  const obs = new MutationObserver(() => {
    if (document.querySelector("#root [data-testid]")) { document.getElementById("boot").remove(); obs.disconnect(); }
  });
  obs.observe(document.getElementById("root"), { childList: true, subtree: true });
} catch (e) {
  msg.textContent = "불러오기에 실패했습니다: " + e;
}
</script>
</body>
</html>
